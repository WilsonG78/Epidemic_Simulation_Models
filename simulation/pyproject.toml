[project]
name = "simulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.65.1",
    "numpy>=2.0,<2.5",
    "scipy>=1.14",
    "ruff>=0.17.4",
]

[project.scripts]
simulation = "simulation.main:main"

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "ipython>=9.18.1",
]
cuda = [
    "numba-cuda[cu12]>=0.30.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
